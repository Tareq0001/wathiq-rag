services:
  db:
    image: pgvector/pgvector:pg16
    container_name: wathiq-pgvector
    environment:
      POSTGRES_USER: wathiq
      POSTGRES_PASSWORD: wathiq_dev_password
      POSTGRES_DB: wathiq_rag
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./sql/init_pgvector.sql:/docker-entrypoint-initdb.d/01_init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wathiq -d wathiq_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  wathiq-api:
    build: .
    container_name: wathiq-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      WATHIQ_DB_PATH: /app/data/wathiq.db
      DATABASE_URL: postgresql://wathiq:wathiq_dev_password@db:5432/wathiq_rag
    ports:
      - "8000:8000"
    volumes:
      - wathiq_sqlite:/app/data

volumes:
  pgvector_data:
  wathiq_sqlite:
